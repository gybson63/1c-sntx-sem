[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sntx-sem"
version = "0.1.0"
description = "Semantic search MCP server for 1C BSL and query language help"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "1c-sntx-sem" }]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "lancedb>=0.17",
    "pylance>=0.20",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "types-PyYAML",
]

[project.scripts]
sntx-sem = "sntx_sem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["sntx_sem"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["sntx_sem"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "pyarrow.*",
    "rank_bm25.*",
    "sentence_transformers.*",
    "bs4.*",
    "lxml.*",
    "yaml.*",
    "mcp.*",
    "click.*",
    "httpx.*",
]
ignore_missing_imports = true
