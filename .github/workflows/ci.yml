name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest with coverage
        run: pytest tests/ -v -m "not nightly" --cov=sntx_sem --cov-report=term-missing --cov-fail-under=55

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start API
        run: |
          cp config.docker.example.yaml config.yaml
          mkdir -p data hbk
          docker compose up -d

      - name: Healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8051/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop
        if: always()
        run: docker compose down -v
